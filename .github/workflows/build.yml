name: Build EduMind AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          mkdir work
          unzip -q "$ZIP" -d work

      - name: Build APK
        run: |
          PROJECT=$(find work -name settings.gradle.kts -printf '%h\n' | head -n 1)
          cd "$PROJECT"
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: EduMindAI-APK
          path: work/**/app/build/outputs/apk/debug/*.apk
